name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build icons
        run: npm run icons

      - name: Set version from tag
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version || true

      - name: Build, sign & notarize
        env:
          # Base64 Developer ID Application .p12 (exported without a password).
          # electron-builder imports it into a temporary keychain.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          # Notarization via App Store Connect API key
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npx electron-vite build && npx electron-builder --mac --publish never

      - name: Verify signature & notarization
        run: |
          APP=$(find dist -maxdepth 2 -name 'Prototoy.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build icons
        run: npm run icons

      - name: Set version from tag
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version || true

      - name: Build and package
        run: npm run icons && npx electron-vite build && npx electron-builder --publish never

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
