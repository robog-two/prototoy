appId: com.localify.prototoy
productName: Prototoy
publish:
  - provider: github
    releaseType: release
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*}'
  - '!build/generate-icons.js'
extraResources:
  - from: build/icon/icon-256x256.png
    to: icon.png
asarUnpack:
  - resources/**
  - node_modules/react/**
  - node_modules/react-dom/**
  - node_modules/scheduler/**
mac:
  icon: build/icon/icon.png
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Apple Developer ID cert (Team P6ZG86HAX8). Naming it explicitly makes the
  # build fail loudly instead of silently falling back to ad-hoc signing.
  identity: Samuel Knight (P6ZG86HAX8)
  # Hardened runtime + notarization so Gatekeeper opens the app without warnings.
  # Notarization credentials come from APPLE_API_KEY / APPLE_API_KEY_ID /
  # APPLE_API_ISSUER env vars (App Store Connect API key).
  hardenedRuntime: true
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  target:
    - dmg
    - zip
linux:
  icon: build/icon/
  category: Development
  description: UI mockup and wireframe organizer
  maintainer: Localify
  desktop:
    entry:
      StartupWMClass: Prototoy
  target:
    - AppImage
